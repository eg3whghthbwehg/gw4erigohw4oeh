<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .loading-text {
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="loading-text" id="loadingText">LOADING (gerks is fat)</div>

    <script>
        // Total wait time before redirecting is 3 seconds (as requested)
        setTimeout(function() {
            window.location.href = "https://game.grandtheftauto5.online/";
        }, 3000);
    </script>

</body>
</html>
